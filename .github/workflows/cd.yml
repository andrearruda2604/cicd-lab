name: CI/CD Pipeline

# permissões necessárias para publicar no GHCR via GITHUB_TOKEN
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build (local check)
        run: docker build -t cicd-lab:${{ github.sha }} .

  publish_image:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'   # publica só na main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch support)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cicd-lab:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cicd-lab:latest

      - name: Output image name
        run: echo "Image pushed: ghcr.io/${{ github.repository_owner }}/cicd-lab:${{ github.sha }}"
